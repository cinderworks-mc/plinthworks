plugins {
	id 'java-library'
	id 'net.neoforged.moddev' version '2.0.146'
}

version = project.mod_version
group = project.maven_group
base.archivesName = "${project.mod_id}-${project.minecraft_version}"

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// thaumaturge has no 1.21.1 maven and its licence keeps the jar out of the repo and out of everything we publish.
// the essentia compat lives in its own source set and only builds against a local copy (libs/README.md).
// without one the build is the core alone, which runs the same with or without thaumaturge installed
def thaumaturgeJar = file(providers.gradleProperty('thaumaturge_jar').getOrElse('libs/thaumaturge-1.21.1-NeoForge-1.0.3.jar'))
def withThaumaturge = thaumaturgeJar.isFile()
// release builds set this, so a missing jar fails the build instead of shipping without the compat
if (providers.gradleProperty('expect_compat').getOrElse('false').toBoolean() && !withThaumaturge) {
	throw new GradleException("expect_compat is set but there is no thaumaturge jar at ${thaumaturgeJar}")
}

// test only code, on the classpath of the dev runs and never in the jar
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
	thaumaturge {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

configurations {
	gametestImplementation.extendsFrom implementation
	gametestCompileOnly.extendsFrom compileOnly
	gametestRuntimeOnly.extendsFrom runtimeOnly
	thaumaturgeImplementation.extendsFrom implementation
	thaumaturgeCompileOnly.extendsFrom compileOnly
}

repositories {
	mavenCentral()
	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}
}

neoForge {
	version = project.neoforge_version

	parchment {
		minecraftVersion = project.parchment_minecraft_version
		mappingsVersion = project.parchment_mappings_version
	}

	runs {
		client {
			client()
			sourceSet = sourceSets.gametest
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}
		server {
			server()
			sourceSet = sourceSets.gametest
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}
		gameTestServer {
			type = 'gameTestServer'
			gameDirectory = file('run/gametest')
			sourceSet = sourceSets.gametest
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}
		data {
			data()
			programArguments.addAll('--mod', project.mod_id, '--all',
					'--output', file('src/generated/resources/').absolutePath,
					'--existing', file('src/main/resources/').absolutePath)
		}
	}

	mods {
		plinthworks {
			sourceSet sourceSets.main
			sourceSet sourceSets.gametest
			if (withThaumaturge) {
				sourceSet sourceSets.thaumaturge
			}
		}
	}

	addModdingDependenciesTo(sourceSets.gametest)
	addModdingDependenciesTo(sourceSets.thaumaturge)

	unitTest {
		enable()
		testedMod = mods.plinthworks
	}
}

sourceSets.main.resources {
	srcDir 'src/generated/resources'
	exclude '.cache/**'
}

dependencies {
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation "com.google.code.gson:gson:${project.gson_version}"
}

test {
	useJUnitPlatform()
}

processResources {
	var props = [
		mod_version      : project.mod_version,
		mod_id           : project.mod_id,
		mod_name         : project.mod_name,
		minecraft_version: project.minecraft_version,
		neoforge_version : project.neoforge_version,
	]
	inputs.properties props
	filesMatching('META-INF/neoforge.mods.toml') {
		expand props
	}
}

tasks.named('jar') {
	from('LICENSE')
}

if (withThaumaturge) {
	dependencies {
		thaumaturgeCompileOnly files(thaumaturgeJar)
	}
	sourceSets.gametest.runtimeClasspath += sourceSets.thaumaturge.output
	tasks.named('jar') {
		from sourceSets.thaumaturge.output
	}
} else {
	tasks.named('compileThaumaturgeJava') {
		enabled = false
	}
	logger.lifecycle("no thaumaturge jar at ${rootProject.relativePath(thaumaturgeJar)}, building without the essentia compat (see libs/README.md)")
}
