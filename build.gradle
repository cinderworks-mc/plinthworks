plugins {
	id 'java-library'
	id 'net.neoforged.moddev' version '2.0.146'
}

version = project.mod_version
group = project.maven_group
base.archivesName = "${project.mod_id}-${project.minecraft_version}"

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}
}

neoForge {
	version = project.neoforge_version

	parchment {
		minecraftVersion = project.parchment_minecraft_version
		mappingsVersion = project.parchment_mappings_version
	}

	runs {
		client {
			client()
		}
		server {
			server()
		}
		gameTestServer {
			type = 'gameTestServer'
			gameDirectory = file('run/gametest')
		}
		data {
			data()
			programArguments.addAll('--mod', project.mod_id, '--all',
					'--output', file('src/generated/resources/').absolutePath,
					'--existing', file('src/main/resources/').absolutePath)
		}
	}

	mods {
		plinthworks {
			sourceSet sourceSets.main
		}
	}

	unitTest {
		enable()
		testedMod = mods.plinthworks
	}
}

sourceSets.main.resources {
	srcDir 'src/generated/resources'
	exclude '.cache/**'
}

dependencies {
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation "com.google.code.gson:gson:${project.gson_version}"
}

test {
	useJUnitPlatform()
}

processResources {
	var props = [
		mod_version      : project.mod_version,
		mod_id           : project.mod_id,
		mod_name         : project.mod_name,
		minecraft_version: project.minecraft_version,
		neoforge_version : project.neoforge_version,
	]
	inputs.properties props
	filesMatching('META-INF/neoforge.mods.toml') {
		expand props
	}
}
